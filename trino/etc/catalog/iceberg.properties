# NOTE: s3.aws-access-key/secret должны совпадать с MINIO_ROOT_USER/PASSWORD из .env
# (Trino не подставляет env в catalog-файлах, поэтому при смене .env поправьте и здесь,
#  а также spark/conf/spark-defaults.conf).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/wh/
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123
