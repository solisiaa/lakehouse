lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'admin') }}"
      password: ""
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8082') | int }}"
      catalog: iceberg
      schema: staging
      threads: 4
      http_scheme: http
      session_properties:
        query_max_run_time: 5m
    prod:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'admin') }}"
      password: ""
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      catalog: iceberg
      schema: staging
      threads: 4
      http_scheme: http
